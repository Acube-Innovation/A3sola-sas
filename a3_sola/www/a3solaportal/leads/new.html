{% extends "templates/portal_shell.html" %}

{% block portal_content %}
<div class="a3s-page__head">
	<div>
		<h2 class="a3s-main__title">New lead</h2>
		<p class="a3s-main__sub">Capture an enquiry into ERPNext.</p>
	</div>
	<a class="a3s-btn a3s-btn--ghost" href="/a3solaportal/leads">&larr; Back to leads</a>
</div>

<div class="a3s-card a3s-formcard">
	<form class="a3s-form" id="a3s-lead-form" novalidate>
		<div class="a3s-field-row">
			<div class="a3s-field" id="f-lead_name">
				<label for="lead_name">Lead name</label>
				<input type="text" id="lead_name" name="lead_name" autocomplete="name"
				       placeholder="Person's full name">
			</div>
			<div class="a3s-field" id="f-company_name">
				<label for="company_name">Company</label>
				<input type="text" id="company_name" name="company_name"
				       autocomplete="organization" placeholder="Organisation, if any">
			</div>
		</div>
		<p class="a3s-field__hint">Enter a person's name, a company, or both &mdash; at least one is required.</p>

		<div class="a3s-field-row">
			<div class="a3s-field" id="f-email_id">
				<label for="email_id">Email</label>
				<input type="email" id="email_id" name="email_id" autocomplete="email"
				       spellcheck="false" placeholder="name@example.com">
			</div>
			<div class="a3s-field" id="f-mobile_no">
				<label for="mobile_no">Mobile</label>
				<input type="tel" id="mobile_no" name="mobile_no" autocomplete="tel"
				       placeholder="+91 ">
			</div>
		</div>

		<div class="a3s-field-row">
			<div class="a3s-field" id="f-status">
				<label for="status">Status</label>
				<select id="status" name="status">
					{%- for opt in status_options %}
					<option value="{{ opt }}"{% if opt == "Lead" %} selected{% endif %}>{{ opt }}</option>
					{%- endfor %}
				</select>
			</div>
			<div class="a3s-field" id="f-source">
				<label for="source">Source <span class="a3s-field__opt">(optional)</span></label>
				<select id="source" name="source">
					<option value="">&mdash;</option>
					{%- for src in sources %}
					<option value="{{ src }}">{{ src }}</option>
					{%- endfor %}
				</select>
			</div>
		</div>

		<div class="a3s-form__actions">
			<button type="submit" class="a3s-btn a3s-btn--primary" id="a3s-lead-submit">Create lead</button>
			<a class="a3s-btn a3s-btn--ghost" href="/a3solaportal/leads">Cancel</a>
			<p class="a3s-form__status" id="a3s-lead-status" role="status" aria-live="polite"></p>
		</div>
	</form>
</div>
{% endblock %}

{% block portal_scripts %}
<script src="/assets/a3_sola/js/portal_lead_form.js?v={{ asset_version }}"></script>
{% endblock %}
